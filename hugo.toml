baseURL = 'https://dissinmanga.github.io/'
locale = 'en-us'
title = '今天嘴漫畫'
theme = 'congo'
defaultContentLanguage = "zh-hant"
languageCode = "zh-Hant-TW"

summaryLength = 0
hasCJKLanguage = true

[params]
	enableSearch = true
	mainSections = ["post"]

[params.homepage]
	layout = "page"
	showRecent = true
	recentLimit = 10

[params.header]
	layout = "basic"

[params.footer]
	showAppearanceSwitcher = true

[pagination]
	pagerSize = 30

[[menu.main]]
	name = "文章"
	url = "/post/" 

[[menu.main]]
	name = "隨機"
	url = "/#random" 

[outputs]
	home = ["HTML", "JSON"]
